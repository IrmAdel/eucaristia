<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qual é a sua visão do mistério eucarístico?</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2420;--mu:#7a6e64;--card:#fff;--bd:#e3dbd0;--ac:#7b2d3b;--ac2:#b08a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1715;--fg:#efe8df;--mu:#a49889;--card:#26211e;--bd:#3a332e;--ac:#d98a9a;--ac2:#d4b061}}
:root[data-theme="dark"]{--bg:#1b1715;--fg:#efe8df;--mu:#a49889;--card:#26211e;--bd:#3a332e;--ac:#d98a9a;--ac2:#d4b061}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 Georgia,'Times New Roman',serif}
main{max-width:680px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:1.7rem;line-height:1.2;margin:.2em 0}h2{font-size:1.25rem;line-height:1.35;margin:.4em 0 1em}
.mu{color:var(--mu);font-size:.92rem}
.bar{height:5px;background:var(--bd);border-radius:3px;margin:14px 0 22px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
button.o{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:13px 15px;margin:0 0 10px;cursor:pointer}
button.o:hover,button.o.s{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
button.p{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
button.g{font:inherit;background:none;color:var(--mu);border:0;padding:12px 8px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.ax{margin:18px 0}.ax b{display:block;margin-bottom:4px}
.tr{position:relative;height:8px;background:var(--bd);border-radius:4px}.tr:after{content:"";position:absolute;left:50%;top:-3px;height:14px;width:1px;background:var(--mu)}
.tr i{position:absolute;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--ac);transform:translateX(-50%);border:2px solid var(--bg)}
.pl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mu);margin-top:6px;gap:12px}.pl span:last-child{text-align:right}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:12px 0}
.cd h3{margin:0 0 4px;font-size:1rem;color:var(--ac2)}
.hide{display:none}
</style></head><body><main id="app"></main>
<script>
const AX=[
{k:'A',n:'Onde está a presença',l:'Na ação e na recepção da fé',r:'No próprio pão e vinho',t:['Para você, Cristo se dá na ação e no encontro com quem recebe; o elemento é sinal e meio, não recipiente.','Você sustenta a presença sem localizá-la só no elemento nem só no fiel: ela é do evento inteiro.','Você liga a presença ao próprio pão e vinho consagrados: ela permanece, e não depende só de quem recebe.']},
{k:'B',n:'O que a consagração faz ao elemento',l:'Sentido novo, elemento inalterado',r:'Mudança real do elemento',t:['Pão e vinho permanecem o que são; o que muda é seu uso, destino e significado.','Você aceita uma união entre Cristo e os elementos, sem decidir se o pão deixa de ser pão.','Você crê que algo se transforma no elemento mesmo, para além das aparências.']},
{k:'C',n:'Sacrifício',l:'Memorial e ação de graças',r:'Sacrifício tornado presente',t:['A missa é lembrança e louvor; nada se oferece que acrescente ao Calvário.','Você vê a missa como participação no sacrifício eterno de Cristo, sem repeti-lo.','Você vê na missa o único sacrifício de Cristo realmente presente e oferecido pela Igreja.']},
{k:'D',n:'Mediação e eficácia',l:'Fé e Espírito, livres',r:'Igreja e ministro, objetivos',t:['A eficácia vem do Espírito e da fé; a ordem eclesial serve, mas não condiciona.','Você equilibra: a Igreja e o ministro importam, mas a fé e o Espírito não ficam presos a eles.','Você crê numa eficácia que depende da ordem da Igreja e do ministro, antes da disposição de quem recebe.']},
{k:'E',n:'Definição e mistério',l:'Mistério sem definição',r:'Precisão doutrinária',t:['Você desconfia de explicações; o que importa é afirmar a presença sem dizer como.','Você usa definições como balizas, sem torná-las o centro.','Você acha que o mistério precisa de linguagem precisa, senão a fé se dissolve.']},
{k:'F',n:'Reverência fora da missa',l:'Só no uso, na celebração',r:'Também reservado e adorado',t:['A presença é para a comunhão; reservar para adorar desloca o sentido.','Você reserva por cuidado pastoral, sem fazer disso devoção central.','Você crê que a presença permanece e merece adoração mesmo fora da celebração.']}];
const Q=[
{q:'Alguém comunga por puro hábito, sem fé alguma. O que acontece?',o:[
['Recebe de fato o Corpo de Cristo, ainda que para o próprio juízo.',{A:2,D:2,B:1}],
['Recebe pão e vinho; sem fé, para ele não há sacramento.',{A:-2,D:-2,B:-1}],
['Cristo se oferece objetivamente, mas a comunhão só se completa onde há fé.',{A:0,D:0,E:-1}],
['A pergunta separa o que o mistério não separa.',{E:-2}]]},
{q:'Sobrou pão consagrado após a missa. Qual é o gesto mais fiel?',o:[
['Reservá-lo com reverência: Cristo continua presente e é adorável.',{F:2,A:2,B:2}],
['Reservá-lo para os enfermos, sem devoção própria a ele.',{F:0,A:1}],
['Consumi-lo com respeito, pois a presença é para o uso.',{F:-2,A:-1}],
['Tratá-lo como pão abençoado, sem tratamento especial.',{F:-2,A:-2,B:-2}]]},
{q:'O que a oração de consagração faz ao pão?',o:[
['Muda a realidade mais profunda do pão, mantendo as aparências.',{B:2,E:2,A:2}],
['Une Cristo ao pão sem eliminar o que o pão é.',{B:0,A:1,E:1}],
['Dá ao pão um novo destino: sinal eficaz que comunica Cristo.',{B:-1,A:-1}],
['Nada muda no pão; muda a assembleia diante dele.',{B:-2,A:-2,D:-2}]]},
{q:'Em "Isto é o meu corpo", o verbo "é" quer dizer:',o:[
['Identidade literal.',{B:2,E:1}],
['Identidade sacramental: é o que significa e o que confere.',{B:0,C:0}],
['Significa, representa.',{B:-2,C:-2}],
['É palavra que age e ultrapassa a divisão entre literal e figurado.',{E:-2}]]},
{q:'A missa é sacrifício?',o:[
['Sim: o único sacrifício do Calvário se torna presente e a Igreja o oferece.',{C:2,D:2}],
['A Igreja se une ao sacrifício eterno de Cristo, oferecendo louvor e a si mesma.',{C:1}],
['É memorial: só se oferece louvor e ação de graças.',{C:-2}],
['Qualquer "oferta" nossa obscurece a suficiência de Cristo.',{C:-2,D:-1}]]},
{q:'Qual é o momento decisivo da eficácia?',o:[
['As palavras da instituição, ditas por ministro válido.',{D:2,B:1,E:1}],
['A grande oração inteira, com a invocação do Espírito.',{D:1,E:-1}],
['A fé de quem recebe, na comunhão.',{D:-2,A:-2}],
['A ação de toda a comunidade reunida.',{D:-1,A:-1,E:-1}]]},
{q:'Um presidente sem ordenação reconhecida celebra com fé sincera. E então?',o:[
['Não há eucaristia plena.',{D:2}],
['Há algo real de Cristo, mas irregular e incompleto.',{D:1,E:-1}],
['Cristo se dá onde é invocado com fé; a ordem serve ao bom andamento.',{D:-2}],
['Recuso fechar a questão.',{E:-2}]]},
{q:'A Igreja precisa de uma doutrina precisa (como "transubstanciação")?',o:[
['Sim: sem dizer o que acontece, o mistério vira vagueza.',{E:2}],
['É boa baliza, mas a explicação filosófica não deveria ser dogma.',{E:0}],
['Basta afirmar que Cristo está realmente ali, sem dizer como.',{E:-2,A:1}],
['Definições dividiram mais do que serviram.',{E:-2}]]},
{q:'Cristo subiu ao céu. Em que sentido está na eucaristia?',o:[
['Presente corporalmente no sacramento, de modo não espacial.',{A:2,B:2}],
['No céu; o Espírito nos eleva até ele na comunhão.',{A:-1,B:-1,E:-1}],
['No céu e no sacramento, sem divisão: mistério de dois âmbitos.',{A:1,E:-2}],
['Presente na comunhão de fiéis; o sacramento a manifesta.',{A:-2,D:-1}]]},
{q:'Um padre celebra sozinho, sem ninguém para comungar. Isso é eucaristia?',o:[
['Sim: a consagração e a oferta valem em si mesmas.',{A:2,D:2,C:1,F:1}],
['É eucaristia, mas incompleta: falta partilha.',{A:0,D:0}],
['Não: sem comunhão do povo, não há ceia, só rito.',{A:-2,D:-1,C:-1}],
['Depende de em que sentido a comunidade está presente.',{E:-1}]]},
{q:'Qual é o maior risco para a vida da Igreja hoje?',o:[
['Minimizar a presença e perder o próprio Cristo.',{A:2,B:1,E:1}],
['Maximizar o objeto e cair na idolatria do pão.',{A:-2,F:-2}],
['Racionalizar a ponto de matar o mistério.',{E:-2}],
['Privatizar a eucaristia e perder a Igreja.',{D:1,C:1}]]}];
const REF=[
['Transubstanciação tomista',[90,100,90,80,90,90]],
['União sacramental luterana',[70,20,-20,40,30,30]],
['Presença espiritual reformada',[-30,-60,-40,-40,0,-60]],
['Memorial zwingliano',[-90,-100,-90,-70,-20,-90]],
['Tradição oriental, mistério',[70,70,50,60,-80,60]],
['Via media anglicana clássica',[0,-20,10,0,-60,-10]]];
const keys='ABCDEF'.split('');let i=0,ans=[],app=document.getElementById('app');
function start(){app.innerHTML=`<p class="mu">Quiz teológico</p><h1>Qual é a sua visão do mistério eucarístico?</h1><p>Onze perguntas de dilema, sem respostas "certas". O resultado mede você em seis eixos e só depois compara com posições históricas. Se nenhuma se aproximar, o resultado diz isso.</p><p class="mu">Responda pelo que você realmente crê, não pelo que sua tradição espera.</p><button class="p" onclick="show()">Começar</button>`}
function show(){const d=Q[i];app.innerHTML=`<p class="mu">Pergunta ${i+1} de ${Q.length}</p><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><h2>${d.q}</h2>`+d.o.map((o,j)=>`<button class="o ${ans[i]===j?'s':''}" onclick="pick(${j})">${o[0]}</button>`).join('')+`<div class="row"><button class="g ${i?'':'hide'}" onclick="back()">Voltar</button></div>`}
function pick(j){ans[i]=j;i++;i<Q.length?show():res()}
function back(){i--;show()}
function res(){
const mx={},sc={};keys.forEach(k=>{mx[k]=0;sc[k]=0});
Q.forEach((d,n)=>{keys.forEach(k=>{mx[k]+=Math.max(...d.o.map(o=>Math.abs(o[1][k]||0)))});const w=d.o[ans[n]][1];keys.forEach(k=>sc[k]+=w[k]||0)});
const v=keys.map(k=>Math.round(sc[k]/mx[k]*100));
const sim=REF.map(r=>[r[0],Math.max(0,Math.round(100-r[1].reduce((s,x,n)=>s+Math.abs(x-v[n]),0)/6*0.8))]).sort((a,b)=>b[1]-a[1]);
const T=[];const [A,B,C,D,E,F]=v;
if(C>30&&B<-20)T.push('Você afirma sacrifício real, mas não vê mudança no elemento. Pergunta: o que, exatamente, está sendo oferecido e onde?');
if(F>30&&D<-20)T.push('Você adora o sacramento reservado, mas liga a eficácia à fé de quem recebe. Pergunta: a presença permanece quando ninguém crê?');
if(B>40&&E<-30)T.push('Você crê numa mudança real do elemento, mas recusa defini-la. Pergunta: como afirmar essa mudança sem dizer em que consiste?');
if(A<-30&&C>30)T.push('Você põe a presença na ação da fé, mas fala de sacrifício objetivo. Pergunta: o sacrifício também depende da recepção?');
if(D>40&&A<-20)T.push('Você exige ministro e ordem, mas não localiza a presença no elemento. Pergunta: o que a ordem garante, então?');
const top=sim[0][1]>=75?`Sua visão ressoa com <b>${sim[0][0]}</b> (${sim[0][1]}%), com segunda aproximação em ${sim[1][0]} (${sim[1][1]}%).`:`Nenhuma posição histórica chega a 75% de afinidade (a mais próxima é ${sim[0][0]}, ${sim[0][1]}%). Isso indica uma visão própria, que combina elementos de tradições diferentes.`;
app.innerHTML=`<p class="mu">Resultado</p><h1>Seu mapa eucarístico</h1><div class="cd"><h3>Ressonâncias históricas</h3>${top}</div>`+
AX.map((a,n)=>{const p=(v[n]+100)/2,t=a.t[v[n]<-33?0:v[n]>33?2:1];return `<div class="ax"><b>${a.n}</b><div class="tr"><i style="left:${p}%"></i></div><div class="pl"><span>${a.l}</span><span>${a.r}</span></div><p class="mu" style="margin:8px 0 0">${t}</p></div>`}).join('')+
`<h2>Tensões internas</h2>`+(T.length?T.map(t=>`<div class="cd">${t}</div>`).join(''):'<div class="cd">Suas respostas não revelaram contradições evidentes. Isso pode indicar coerência ou posição ainda pouco definida em algum ponto.</div>')+
`<div class="cd"><h3>Como ler</h3>Os eixos medem tendência, não verdade. Valores perto do centro podem significar equilíbrio ou indecisão: vale revisar suas respostas.</div><div class="row"><button class="g" onclick="i=0;ans=[];start()">Refazer</button></div>`}
start();
</script></body></html>
